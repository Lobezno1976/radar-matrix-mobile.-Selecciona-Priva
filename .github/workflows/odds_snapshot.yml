name: RADAR odds snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9,15,19 * * *'
permissions:
  contents: write
concurrency:
  group: radar-odds
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch The Odds API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py
      - name: Publish snapshot only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update LaLiga odds snapshot"
            git push
          fi
