name: Verify RADAR version identity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  version-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical version identity
        run: python scripts/verify-version.py
      - name: Verify local assets and JavaScript syntax
        run: python scripts/verify-assets.py
